version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-backend:latest}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - db
      - redis

  celery:
    image: ${BACKEND_IMAGE:-backend:latest}
    command: celery -A celery_app.app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis

  celery-beat:
    image: ${BACKEND_IMAGE:-backend:latest}
    command: celery -A celery_app.app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis

  frontend:
    image: ${FRONTEND_IMAGE:-frontend:latest}
    env_file:
      - ./frontend/.env.local

  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
