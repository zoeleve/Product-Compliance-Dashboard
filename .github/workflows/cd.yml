name: CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/compliance-backend:${{ steps.tag.outputs.tag }} ./backend
          docker push $ECR_REGISTRY/compliance-backend:${{ steps.tag.outputs.tag }}

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/compliance-frontend:${{ steps.tag.outputs.tag }} ./frontend
          docker push $ECR_REGISTRY/compliance-frontend:${{ steps.tag.outputs.tag }}

  update-helm:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tags
        run: |
          TAG=${{ needs.build-push.outputs.image-tag }}
          sed -i "s|tag: .*|tag: $TAG|g" k8s/helm/compliance-dashboard/values.yaml

      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/compliance-dashboard/values.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ needs.build-push.outputs.image-tag }}"
          git push
