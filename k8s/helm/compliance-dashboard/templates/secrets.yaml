apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.djangoSecretKey | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | b64enc }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | b64enc }}
  ODOO_API_KEY: {{ .Values.secrets.odooApiKey | b64enc }}
