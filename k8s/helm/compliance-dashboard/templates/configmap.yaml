apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  DJANGO_SETTINGS_MODULE: {{ .Values.env.DJANGO_SETTINGS_MODULE }}
  POSTGRES_HOST: {{ .Values.env.POSTGRES_HOST }}
  POSTGRES_PORT: {{ .Values.env.POSTGRES_PORT | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB }}
  REDIS_URL: {{ .Values.env.REDIS_URL }}
  CELERY_BROKER_URL: {{ .Values.env.CELERY_BROKER_URL }}
  CELERY_RESULT_BACKEND: {{ .Values.env.CELERY_RESULT_BACKEND }}
